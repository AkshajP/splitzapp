name: Test Versioning

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "minor"
        type: choice
        options:
          - minor
          - major

jobs:
  test-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate version
        id: version
        run: |
          git fetch --tags

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            version=${latest#v}
            major=${version%%.*}
            minor=${version##*.}
          fi

          if [ "${{ github.event.inputs.release_type }}" = "major" ]; then
            major=$((major + 1))
            minor=0
          else
            minor=$((minor + 1))
          fi

          new_version="v${major}.${minor}"

          echo "version=$new_version" >> $GITHUB_OUTPUT

      - name: Print version
        run: echo "Next version is ${{ steps.version.outputs.version }}"
